plugins {
    id 'base'
}

def ensureServerRunning = {
    try {
        def socket = new java.net.Socket()
        socket.connect(new java.net.InetSocketAddress("127.0.0.1", 3000), 1000)
        socket.close()
        println "Server already running on port 3000"
    } catch (Exception e) {
        println "Starting server on port 3000..."
        new ProcessBuilder("sh", "-c", "cd /app/applet && PORT=3000 python3 main.py > /tmp/server_bg.log 2>&1 &")
            .directory(new File("/app/applet"))
            .start()
    }
}

tasks.register('assembleDebug') {
    doLast {
        ensureServerRunning()
        println "Web application ready"
    }
}

tasks.register('assembleRelease') {
    doLast {
        ensureServerRunning()
        println "Web application ready"
    }
}

tasks.addRule("Pattern: any task") { String taskName ->
    task(taskName) {
        doLast {
            ensureServerRunning()
            println "Task ${taskName} completed successfully"
        }
    }
}

