<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Sapphire Glow Gradient -->
    <radialGradient id="bgGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#4fc3f7" />
      <stop offset="25%" stop-color="#0288d1" />
      <stop offset="65%" stop-color="#01579b" />
      <stop offset="100%" stop-color="#002f6c" />
    </radialGradient>

    <!-- Luxury Gold Decorative Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" />
      <stop offset="20%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="90%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Cyan Luminous Edge Gradient -->
    <linearGradient id="cyanRimGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- Convex Crystal Gloss Reflection -->
    <linearGradient id="glossGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- Bottom Ambient Reflection -->
    <radialGradient id="bottomGlow" cx="50%" cy="95%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#01579b" stop-opacity="0" />
    </radialGradient>

    <!-- Paper Airplane Shading -->
    <linearGradient id="planeMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f0f7ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>

    <linearGradient id="planeFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <linearGradient id="planeBackGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- 3D Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#001833" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="planeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#001f3f" flood-opacity="0.45" />
      <feDropShadow dx="-2" dy="4" stdDeviation="4" flood-color="#002b55" flood-opacity="0.3" />
    </filter>

    <filter id="glowSparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Clipping Mask for Gloss Sheen -->
    <clipPath id="squircleClip">
      <rect x="24" y="24" width="464" height="464" rx="116" ry="116" />
    </clipPath>
  </defs>

  <!-- 1. Outermost Ambient Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="#001022" opacity="0.3" filter="url(#shadowFilter)" />

  <!-- 2. Main Icon Body with Sapphire Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#bgGrad)" />

  <!-- 3. Bottom Ambient Reflected Light -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#bottomGlow)" clip-path="url(#squircleClip)" />

  <!-- 4. Decorative Filigree & Ornamental Borders -->
  <!-- Outer Gold Rim -->
  <rect x="28" y="28" width="456" height="456" rx="112" ry="112" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" opacity="0.85" />

  <!-- Inner Cyan Precision Line -->
  <rect x="36" y="36" width="440" height="440" rx="104" ry="104" fill="none" stroke="url(#cyanRimGrad)" stroke-width="1.8" opacity="0.9" />

  <!-- Ornamental Corner Motifs (Arabesque Floral Accents) -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.75">
    <!-- Top-Left Corner Ornament -->
    <path d="M 52 108 C 64 96, 96 64, 108 52" />
    <path d="M 62 118 C 76 104, 104 76, 118 62" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="85" cy="85" r="4.5" fill="url(#goldGrad)" />
    <circle cx="68" cy="102" r="2.5" fill="url(#goldGrad)" />
    <circle cx="102" cy="68" r="2.5" fill="url(#goldGrad)" />

    <!-- Top-Right Corner Ornament -->
    <path d="M 460 108 C 448 96, 416 64, 404 52" />
    <path d="M 450 118 C 436 104, 408 76, 394 62" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="427" cy="85" r="4.5" fill="url(#goldGrad)" />
    <circle cx="444" cy="102" r="2.5" fill="url(#goldGrad)" />
    <circle cx="410" cy="68" r="2.5" fill="url(#goldGrad)" />

    <!-- Bottom-Left Corner Ornament -->
    <path d="M 52 404 C 64 416, 96 448, 108 460" />
    <path d="M 62 394 C 76 408, 104 436, 118 450" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="85" cy="427" r="4.5" fill="url(#goldGrad)" />
    <circle cx="68" cy="410" r="2.5" fill="url(#goldGrad)" />
    <circle cx="102" cy="444" r="2.5" fill="url(#goldGrad)" />

    <!-- Bottom-Right Corner Ornament -->
    <path d="M 460 404 C 448 416, 416 448, 404 460" />
    <path d="M 450 394 C 436 408, 408 436, 394 450" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="427" cy="427" r="4.5" fill="url(#goldGrad)" />
    <circle cx="444" cy="410" r="2.5" fill="url(#goldGrad)" />
    <circle cx="410" cy="444" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Decorative Bead Stars along Edges -->
  <g fill="url(#goldGrad)" opacity="0.8">
    <circle cx="256" cy="36" r="3.5" />
    <circle cx="240" cy="36" r="2" />
    <circle cx="272" cy="36" r="2" />

    <circle cx="256" cy="476" r="3.5" />
    <circle cx="240" cy="476" r="2" />
    <circle cx="272" cy="476" r="2" />

    <circle cx="36" cy="256" r="3.5" />
    <circle cx="36" cy="240" r="2" />
    <circle cx="36" cy="272" r="2" />

    <circle cx="476" cy="256" r="3.5" />
    <circle cx="476" cy="240" r="2" />
    <circle cx="476" cy="272" r="2" />
  </g>

  <!-- 5. 3D Embossed Telegram Paper Airplane -->
  <g filter="url(#planeShadow)" transform="translate(2, -2)">
    <!-- Right Wing / Back Fold (Deep blue-cyan shading) -->
    <path d="M 226 312 L 278 360 C 286 367, 296 364, 298 354 L 305 320 Z" fill="url(#planeBackGrad)" />

    <!-- Left Wing Fold / Shadow (Mid-tone) -->
    <path d="M 226 312 L 230 264 L 362 174 C 368 170, 375 174, 370 180 L 226 312 Z" fill="url(#planeFoldGrad)" />

    <!-- Main Front Wing / Body (Crisp Pearl White) -->
    <path d="M 124 246 C 114 242, 114 232, 126 228 L 372 136 C 384 132, 394 140, 390 152 L 344 366 C 340 380, 328 382, 318 372 L 226 312 L 340 196 C 344 192, 338 188, 334 192 L 202 278 L 124 246 Z" fill="url(#planeMainGrad)" />

    <!-- Specular Highlight Line Along Central Spine -->
    <path d="M 128 238 L 376 142" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- 6. Convex Glass Gloss & Specular Lens Reflections -->
  <g clip-path="url(#squircleClip)">
    <!-- Major Gloss Wave (Top curved specular shine) -->
    <path d="M 24 24 L 488 24 L 488 180 C 420 220, 300 240, 160 210 C 80 192, 40 170, 24 150 Z" fill="url(#glossGrad)" opacity="0.75" />

    <!-- Diagonal Crystal Sheen Beam -->
    <path d="M 60 24 L 140 24 L 24 140 L 24 60 Z" fill="#ffffff" opacity="0.25" />
    <path d="M 160 24 L 280 24 L 24 280 L 24 160 Z" fill="#ffffff" opacity="0.12" />
  </g>

  <!-- 7. Brilliant Decorative Sparkles / Starburst Lens Flares -->
  <!-- Major Sparkle: Top-Right Shoulder -->
  <g transform="translate(395, 115)" filter="url(#glowSparkle)">
    <!-- Radial halo -->
    <circle cx="0" cy="0" r="24" fill="#38bdf8" opacity="0.35" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" opacity="0.7" />

    <!-- 8-Point Diamond Star -->
    <path d="M 0 -36 Q 0 0, -36 0 Q 0 0, 0 36 Q 0 0, 36 0 Q 0 0, 0 -36 Z" fill="#ffffff" />
    <path d="M 0 -22 Q 0 0, -22 0 Q 0 0, 0 22 Q 0 0, 22 0 Q 0 0, 0 -22 Z" fill="url(#goldGrad)" />
    <path d="M -14 -14 Q 0 0, 14 14 Q 0 0, 14 -14 Q 0 0, -14 14 Z" fill="#ffffff" opacity="0.85" />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
  </g>

  <!-- Secondary Sparkle: Bottom-Left Edge -->
  <g transform="translate(110, 395)" filter="url(#glowSparkle)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" opacity="0.3" />
    <!-- 4-Point Star -->
    <path d="M 0 -22 Q 0 0, -22 0 Q 0 0, 0 22 Q 0 0, 22 0 Q 0 0, 0 -22 Z" fill="#ffffff" />
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)" />
  </g>

  <!-- Tertiary Tiny Sparkle: Top-Left Edge -->
  <g transform="translate(140, 75)" filter="url(#glowSparkle)">
    <path d="M 0 -12 Q 0 0, -12 0 Q 0 0, 0 12 Q 0 0, 12 0 Q 0 0, 0 -12 Z" fill="#ffffff" opacity="0.9" />
    <circle cx="0" cy="0" r="2" fill="#fef08a" />
  </g>

  <!-- Micro Sparkle near Airplane Nose -->
  <g transform="translate(378, 146)" filter="url(#glowSparkle)">
    <path d="M 0 -9 Q 0 0, -9 0 Q 0 0, 0 9 Q 0 0, 9 0 Q 0 0, 0 -9 Z" fill="#ffffff" opacity="0.95" />
    <circle cx="0" cy="0" r="1.5" fill="#fef08a" />
  </g>
</svg>
