name: Auto Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  deploy-to-render:
    name: Trigger Render Deploy Hook
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook
        run: |
          echo "🚀 Triggering automatic deployment to Render for Anwer_Telegram-..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.render.com/deploy/srv-daps4mm7bikc738kaflg?key=BSGAfvSu9d4")
          echo "$RESPONSE"
          echo "✅ Render deployment hook triggered successfully on push to main."
