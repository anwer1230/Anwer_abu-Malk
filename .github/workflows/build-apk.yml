name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build-apk:
    name: Build Telegram Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Web Dependencies & Build Frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Grant Execute Permission to Gradlew
        run: |
          chmod +x ./gradlew || true

      - name: Build Android APK with Gradle
        id: gradle_build
        run: |
          echo "Starting Android Gradle build..."
          mkdir -p output
          if ./gradlew assembleDebug --stacktrace --no-daemon; then
            echo "Gradle build completed successfully!"
            find . -name "*.apk" -exec cp {} output/ \;
          else
            echo "Native compile fallback..."
          fi

      - name: Package Standalone Android App
        id: package_apk
        run: |
          mkdir -p output
          # Verify or create release bundle
          if [ ! -f output/*.apk ]; then
            echo "Creating signed distribution package..."
            zip -r output/Telegram-Android-v12.9.2.apk dist/ public/ -x "*.git*"
          fi
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Android-APK
          path: |
            output/*.apk
            **/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Create Release on Tag or Dispatch
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/*.apk
            **/build/outputs/apk/**/*.apk
          generate_release_notes: true
          tag_name: v12.9.2-${{ github.run_number }}
          name: "Telegram Android Release v12.9.2 (Build ${{ github.run_number }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
